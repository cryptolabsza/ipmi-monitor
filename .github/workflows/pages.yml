name: Deploy Documentation to GitHub Pages
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-pages-build-recipe.yml@a034e480f77032f3f9afdb079363dea23e48c87a
    permissions:
      contents: read
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on:
    - self-hosted
    - ci-authority-held-r1109244855
    needs: build
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
'on':
  push:
    branches:
    - dev
    - main
    paths:
    - docs/**
  workflow_dispatch: null
  pull_request:
    branches:
    - dev
    - main
