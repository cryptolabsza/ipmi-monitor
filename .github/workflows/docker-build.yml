name: Build and Push Docker Image
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-image-build-recipe.yml@7a8e38d6a61a10337e4f71f6219f67d03f9b2aa1
    permissions:
      contents: read
  publish-build:
    if: github.event_name != 'pull_request'
    needs:
    - build
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-image-publish-recipe.yml@3957a0f9e846a899442e9df7e498280d269f7e29
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
'on':
  push:
    branches:
    - main
    - master
    - develop
    - dev
    tags:
    - v*
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch:
    inputs:
      tag_override:
        description: Override tag (e.g., beta, rc1)
        required: false
        default: ''
permissions:
  contents: read
