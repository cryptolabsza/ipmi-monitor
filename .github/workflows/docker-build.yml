name: Build and Push Docker Image
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-image-build-recipe.yml@a034e480f77032f3f9afdb079363dea23e48c87a
    permissions:
      contents: read
  publish-build:
    if: github.event_name != 'pull_request'
    needs:
    - build
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-image-publish-recipe.yml@e3fc7a3e396045a92e458f3214e75f6b8c313a27
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
'on':
  push:
    branches:
    - main
    - master
    - develop
    - dev
    tags:
    - v*
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch:
    inputs:
      tag_override:
        description: Override tag (e.g., beta, rc1)
        required: false
        default: ''
permissions:
  contents: read
