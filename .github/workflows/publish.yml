name: Publish to PyPI
jobs:
  cpu-build:
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-python-build-recipe.yml@a034e480f77032f3f9afdb079363dea23e48c87a
    permissions:
      contents: read
  publish:
    needs: cpu-build
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    uses: cryptolabsza/ipmi-monitor/.github/workflows/ci-pypi-publish-recipe.yml@e3fc7a3e396045a92e458f3214e75f6b8c313a27
    permissions:
      actions: read
      contents: read
    with:
      producer_run_id: ${{ inputs.producer_run_id || (needs.cpu-build.result == 'success' && github.run_id) || '' }}
      producer_attempt: ${{ inputs.producer_attempt || (needs.cpu-build.result == 'success' && github.run_attempt) || '' }}
      artifact_id: ${{ inputs.artifact_id || needs.cpu-build.outputs.artifact_id || '' }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
permissions:
  contents: read
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match pyproject.toml)
        required: false
      producer_run_id:
        description: Existing verified producer producer run id, or leave all three blank
        required: false
        type: string
      producer_attempt:
        description: Existing verified producer producer attempt, or leave all three blank
        required: false
        type: string
      artifact_id:
        description: Existing verified producer artifact id, or leave all three blank
        required: false
        type: string
  push:
    branches:
    - dev
    - main
  pull_request:
    branches:
    - dev
    - main
