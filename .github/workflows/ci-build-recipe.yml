name: Public CPU build recipe
'on':
  workflow_call:
    outputs:
      artifact_id:
        description: Uploaded artifact ID
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_digest:
        description: GitHub upload artifact SHA256
        value: ${{ jobs.build.outputs.artifact_digest }}
permissions:
  contents: read
jobs:
  build:
    if: >
      github.repository_id == '1109244855' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_protected == true && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == 1109244855 && (github.base_ref
      == 'dev' || github.base_ref == 'main')))
    runs-on:
      group: ci-build-public-ephemeral
      labels:
      - ci-linux-cpu-v1-r1109244855
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - name: Checkout exact source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up managed Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Verify public admission and source contracts
      run: |
        python -m pip install --quiet PyYAML==6.0.3
        python -m unittest discover -s .github/tests -p 'test_ci_public_route.py' -v
    - name: Allocate build artifact directory
      run: |
        mkdir -p ci-artifacts
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Determine version info
      id: version
      run: "# Get version from tag or generate from branch\nif [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n\
        \  VERSION=\"${{ github.ref_name }}\"\n  CHANNEL=\"stable\"\nelif [[ \"${{ github.ref }}\" == refs/heads/main\
        \ ]] || [[ \"${{ github.ref }}\" == refs/heads/master ]]; then\n  VERSION=\"latest\"\n  CHANNEL=\"stable\"\
        \nelif [[ \"${{ github.ref }}\" == refs/heads/develop ]] || [[ \"${{ github.ref }}\" == refs/heads/dev ]];\
        \ then\n  VERSION=\"dev\"\n  CHANNEL=\"development\"\nelse\n  VERSION=\"${{ github.ref_name }}\"\n  CHANNEL=\"\
        feature\"\nfi\n\necho \"version=$VERSION\" >> $GITHUB_OUTPUT\necho \"channel=$CHANNEL\" >> $GITHUB_OUTPUT\n\
        echo \"\U0001F4E6 Building: $VERSION ($CHANNEL channel)\"\n"
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: ghcr.io/cryptolabsza/ipmi-monitor
        tags: |
          # For version tags (v1.6.0): create v1.6.0, 1.6.0, 1.6, latest
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

          # For main branch: just 'main' tag (latest only from version tags)
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

          # For develop/dev branch: 'dev' and 'develop' tags
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev' }}
          type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev' }}

          # For PRs: pr-{number}
          type=ref,event=pr

          # SHA for all builds (for debugging)
          type=sha,prefix=sha-

          # Manual override tag
    - name: Get build info
      id: build_info
      run: "echo \"git_commit=${{ github.sha }}\" >> $GITHUB_OUTPUT\necho \"git_branch=${{ github.ref_name }}\"\
        \ >> $GITHUB_OUTPUT\necho \"build_time=$(date -u '+%Y-%m-%d %H:%M UTC')\" >> $GITHUB_OUTPUT\n# Read actual\
        \ semver from pyproject.toml\nAPP_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*\"\\(.*\\)\".*/\\\
        1/')\necho \"version=${APP_VERSION}\" >> $GITHUB_OUTPUT\necho \"\U0001F4CC App version: ${APP_VERSION}\"\
        \n"
    - name: Build without publishing Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true
        build-args: |
          GIT_COMMIT=${{ steps.build_info.outputs.git_commit }}
          GIT_BRANCH=${{ steps.build_info.outputs.git_branch }}
          BUILD_TIME=${{ steps.build_info.outputs.build_time }}
          APP_VERSION=${{ steps.build_info.outputs.version }}
        outputs: type=oci,dest=${{ github.workspace }}/ci-artifacts/build.tar
    - name: Record fixed image identity and artifact checksum
      run: |
        python - <<'PY'
        import hashlib,json,os,pathlib
        p=pathlib.Path('ci-artifacts/build.tar')
        h=hashlib.sha256()
        with p.open('rb') as stream:
            for block in iter(lambda:stream.read(1024*1024),b''):h.update(block)
        receipt={'artifact_kind':'oci-archive','expected_image':'ghcr.io/cryptolabsza/ipmi-monitor','repository':'cryptolabsza/ipmi-monitor','repository_id':1109244855,'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'filename':p.name,'sha256':h.hexdigest()}
        p.with_suffix('.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
        print(json.dumps(receipt,sort_keys=True))
        PY
    - name: Upload immutable image build
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cpu-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ci-artifacts/build.tar
          ci-artifacts/build.json
        if-no-files-found: error
        retention-days: 7
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
