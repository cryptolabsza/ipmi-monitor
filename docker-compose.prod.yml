# Production Docker Compose - Released main (verified 1.4.2 on 7 November 2026)
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Default main follows the released branch; IMAGE_TAG=sha-de79838 pins 1.4.2.
# Update IMAGE_TAG to upgrade to a new version.

version: '3.8'

services:
  ipmi-monitor:
    image: ghcr.io/cryptolabsza/ipmi-monitor:${IMAGE_TAG:-main}
    container_name: ipmi-monitor
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ipmi-data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-}
      - AI_SERVICE_KEY=${AI_SERVICE_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ipmi-data:
    name: ipmi-monitor-prod-data

# Example .env file for production:
# IMAGE_TAG=main  # Or sha-de79838 to pin verified 1.4.2
# SECRET_KEY=your-production-secret-key
# ADMIN_SECRET=your-admin-password
# AI_SERVICE_URL=https://ipmi-ai.cryptolabs.co.za
# AI_SERVICE_KEY=your-ai-key

